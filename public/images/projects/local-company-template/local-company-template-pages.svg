<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Generic service-business homepage wireframe</title>
  <desc id="desc">
    Wireframe of a service-business homepage: utility bar and navigation, hero with call to action, services grid, trust and reviews band, locations, and a contact form with a sticky phone bar.
  </desc>
  <rect width="1200" height="630" fill="#07151b" />
  <g fill="#9ae6cf" font-family="monospace">
    <text x="40" y="38" font-size="24" font-weight="bold">Homepage wireframe</text>
    <text x="40" y="60" font-size="14">Placeholder layout only. All content is generic and driven by YAML + Markdown.</text>
  </g>
  <g fill="#102c32" stroke="#6ed7b6" stroke-width="2">
    <rect x="40" y="75" width="820" height="36" rx="6" />
    <rect x="40" y="119" width="820" height="150" rx="6" />
    <rect x="40" y="277" width="820" height="130" rx="6" />
    <rect x="40" y="415" width="820" height="70" rx="6" />
    <rect x="40" y="493" width="400" height="80" rx="6" />
    <rect x="460" y="493" width="400" height="80" rx="6" />
    <rect x="40" y="581" width="820" height="32" rx="6" />
  </g>
  <g fill="none" stroke="#6ed7b6" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="56" y="289" width="250" height="78" rx="4" />
    <rect x="325" y="289" width="250" height="78" rx="4" />
    <rect x="594" y="289" width="250" height="78" rx="4" />
    <rect x="56" y="427" width="150" height="46" rx="4" />
    <rect x="222" y="427" width="150" height="46" rx="4" />
    <rect x="388" y="427" width="150" height="46" rx="4" />
    <rect x="554" y="427" width="150" height="46" rx="4" />
    <rect x="720" y="427" width="124" height="46" rx="4" />
  </g>
  <g fill="#6ed7b6" stroke="none">
    <rect x="60" y="205" width="190" height="38" rx="4" />
    <rect x="640" y="135" width="200" height="120" rx="4" opacity="0.25" />
  </g>
  <g fill="#d1fae5" font-family="monospace" font-size="15">
    <text x="56" y="99">[Logo]   Services  Areas  About  Blog  FAQ  Contact   (555) 000-0000</text>
    <text x="60" y="152" font-size="20" font-weight="bold">HERO: [Headline for the business]</text>
    <text x="60" y="180">[Short value proposition, trust line]</text>
    <text x="72" y="229" fill="#07151b" font-weight="bold">[ CTA: Call now ]</text>
    <text x="662" y="200">[hero image]</text>
    <text x="56" y="398" font-size="12" fill="#9ae6cf">SERVICES GRID (3 categories)</text>
    <text x="72" y="320">[Category 1]</text>
    <text x="72" y="344">3 services</text>
    <text x="341" y="320">[Category 2]</text>
    <text x="341" y="344">3 services</text>
    <text x="610" y="320">[Category 3]</text>
    <text x="610" y="344">3 services</text>
    <text x="64" y="454">TRUST BAR</text>
    <text x="230" y="454">[Stat]</text>
    <text x="396" y="454">[Stars]</text>
    <text x="562" y="454">[Partner]</text>
    <text x="728" y="454">[Review]</text>
    <text x="56" y="513" font-weight="bold">LOCATIONS</text>
    <text x="56" y="540">[Area list] [Area list] [Area list]</text>
    <text x="476" y="513" font-weight="bold">CONTACT FORM</text>
    <text x="476" y="540">[Name] [Phone] [Message] [Send]</text>
    <text x="56" y="602" font-size="14">FOOTER + STICKY PHONE BAR (mobile)</text>
  </g>
  <g font-family="monospace" font-size="14" fill="#9ae6cf">
    <text x="885" y="100" font-weight="bold">Data sources</text>
    <text x="885" y="130">Hero, nav</text>
    <text x="885" y="150">branding.yaml</text>
    <text x="885" y="190">Services</text>
    <text x="885" y="210">src/content/services</text>
    <text x="885" y="250">Trust, reviews</text>
    <text x="885" y="270">testimonials.yaml</text>
    <text x="885" y="290">partners.yaml</text>
    <text x="885" y="330">Locations</text>
    <text x="885" y="350">service-areas.yaml</text>
    <text x="885" y="390">Contact form</text>
    <text x="885" y="410">form-config.yaml</text>
    <text x="885" y="450">CTAs</text>
    <text x="885" y="470">ctas.yaml</text>
    <text x="885" y="510">Motion</text>
    <text x="885" y="530">4 animation levels</text>
    <text x="885" y="570">Look</text>
    <text x="885" y="590">9 switchable themes</text>
  </g>
</svg>
