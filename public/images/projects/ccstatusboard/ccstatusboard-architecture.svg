<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">ccstatusboard</title>
<desc id="desc">Data flow diagram: Claude Code session files and a liveness check, transcript JSONL tailing, and usage endpoint polling feed a state store, which renders four Ink and React panels: Usage, System, Sessions, and Detail.</desc>
<rect width="1200" height="630" fill="#07151b" />
<g fill="#9ae6cf" font-family="monospace">
<text x="64" y="80" font-size="36" font-weight="bold">ccstatusboard</text>
<text x="64" y="118" font-size="21">Data flow: local Claude Code files to terminal panels</text>
</g>
<rect x="64" y="170" width="300" height="100" rx="8" fill="#102c32" stroke="#6ed7b6" stroke-width="2" />
<text x="80" y="204" fill="#d1fae5" font-size="20" font-weight="bold" font-family="monospace">Session registry</text>
<text x="80" y="234" fill="#9ae6cf" font-size="16" font-family="monospace">~/.claude/sessions/*.json</text>
<text x="80" y="260" fill="#9ae6cf" font-size="16" font-family="monospace">+ liveness check (PID)</text>
<rect x="64" y="300" width="300" height="100" rx="8" fill="#102c32" stroke="#6ed7b6" stroke-width="2" />
<text x="80" y="334" fill="#d1fae5" font-size="20" font-weight="bold" font-family="monospace">Transcript tailing</text>
<text x="80" y="364" fill="#9ae6cf" font-size="16" font-family="monospace">projects/**/*.jsonl</text>
<text x="80" y="390" fill="#9ae6cf" font-size="16" font-family="monospace">read by byte offset</text>
<rect x="64" y="430" width="300" height="100" rx="8" fill="#102c32" stroke="#6ed7b6" stroke-width="2" />
<text x="80" y="464" fill="#d1fae5" font-size="20" font-weight="bold" font-family="monospace">Usage polling</text>
<text x="80" y="494" fill="#9ae6cf" font-size="16" font-family="monospace">Anthropic OAuth usage</text>
<text x="80" y="520" fill="#9ae6cf" font-size="16" font-family="monospace">endpoint, every 60 s</text>
<rect x="480" y="260" width="220" height="150" rx="8" fill="#102c32" stroke="#6ed7b6" stroke-width="2" />
<text x="496" y="294" fill="#d1fae5" font-size="20" font-weight="bold" font-family="monospace">State</text>
<text x="496" y="324" fill="#9ae6cf" font-size="16" font-family="monospace">Collectors emit</text>
<text x="496" y="350" fill="#9ae6cf" font-size="16" font-family="monospace">events into one</text>
<text x="496" y="376" fill="#9ae6cf" font-size="16" font-family="monospace">snapshot</text>
<rect x="820" y="160" width="316" height="92" rx="8" fill="#102c32" stroke="#6ed7b6" stroke-width="2" />
<text x="836" y="194" fill="#d1fae5" font-size="20" font-weight="bold" font-family="monospace">Usage</text>
<text x="836" y="220" fill="#9ae6cf" font-size="15" font-family="monospace">5h + weekly limits</text>
<text x="836" y="242" fill="#9ae6cf" font-size="15" font-family="monospace">burn rate, est. cost</text>
<rect x="820" y="260" width="316" height="92" rx="8" fill="#102c32" stroke="#6ed7b6" stroke-width="2" />
<text x="836" y="294" fill="#d1fae5" font-size="20" font-weight="bold" font-family="monospace">System</text>
<text x="836" y="320" fill="#9ae6cf" font-size="15" font-family="monospace">CPU, memory, disk</text>
<text x="836" y="342" fill="#9ae6cf" font-size="15" font-family="monospace">network sparklines</text>
<rect x="820" y="360" width="316" height="92" rx="8" fill="#102c32" stroke="#6ed7b6" stroke-width="2" />
<text x="836" y="394" fill="#d1fae5" font-size="20" font-weight="bold" font-family="monospace">Sessions</text>
<text x="836" y="420" fill="#9ae6cf" font-size="15" font-family="monospace">grouped by project</text>
<text x="836" y="442" fill="#9ae6cf" font-size="15" font-family="monospace">status, ctx, cost</text>
<rect x="820" y="460" width="316" height="92" rx="8" fill="#102c32" stroke="#6ed7b6" stroke-width="2" />
<text x="836" y="494" fill="#d1fae5" font-size="20" font-weight="bold" font-family="monospace">Detail</text>
<text x="836" y="520" fill="#9ae6cf" font-size="15" font-family="monospace">tokens, agents</text>
<text x="836" y="542" fill="#9ae6cf" font-size="15" font-family="monospace">cwd, permissions</text>
<g stroke="#6ed7b6" stroke-width="3" fill="none">
<path d="M364 220H420V335H465m-15 -10 15 10 -15 10" />
<path d="M364 350H420V335H465m-15 -10 15 10 -15 10" />
<path d="M364 480H420V335H465m-15 -10 15 10 -15 10" />
<path d="M700 335H760V204H805m-15 -10 15 10 -15 10" />
<path d="M700 335H760V304H805m-15 -10 15 10 -15 10" />
<path d="M700 335H760V404H805m-15 -10 15 10 -15 10" />
<path d="M700 335H760V504H805m-15 -10 15 10 -15 10" />
</g>
<text x="480" y="445" fill="#9ae6cf" font-size="15" font-family="monospace">Ink 7 + React 19 render</text>
<text x="480" y="468" fill="#9ae6cf" font-size="15" font-family="monospace">Read-only toward ~/.claude</text>
<text x="64" y="590" fill="#9ae6cf" font-size="18" font-family="monospace">Alec Reimel · Public repository architecture</text>
</svg>
