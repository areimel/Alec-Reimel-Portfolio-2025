<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">AI Hub</title>
  <desc id="desc">
    Architecture diagram: Markdown and MDX content files are validated by Zod content collections, built by Astro into
    a static site with React islands for search, filter and templates, then deployed to GitHub Pages. A CI lane runs
    Playwright and axe tests on push before the build.
  </desc>
  <rect width="1200" height="630" fill="#07151b" />
  <g fill="#9ae6cf" font-family="monospace">
    <text x="48" y="60" font-size="34" font-weight="bold">AI Hub</text>
    <text x="48" y="92" font-size="19">Content files to static site</text>
  </g>

  <text x="48" y="150" fill="#9ae6cf" font-size="17" font-family="monospace">CI LANE (push to main)</text>
  <g fill="#102c32" stroke="#6ed7b6" stroke-width="2">
    <rect x="48" y="165" width="250" height="60" rx="8" />
    <rect x="378" y="165" width="300" height="60" rx="8" />
    <rect x="758" y="165" width="180" height="60" rx="8" />
    <rect x="1018" y="165" width="134" height="60" rx="8" />
  </g>
  <g fill="#d1fae5" font-size="18" font-family="monospace">
    <text x="64" y="201">git push main</text>
    <text x="394" y="201">Playwright + axe tests</text>
    <text x="774" y="201">Astro build</text>
    <text x="1034" y="201">Deploy</text>
  </g>
  <path
    d="M298 195H362l-12-8m12 8-12 8M678 195H742l-12-8m12 8-12 8M938 195H1002l-12-8m12 8-12 8"
    stroke="#6ed7b6"
    stroke-width="3"
    fill="none"
  />

  <text x="48" y="300" fill="#9ae6cf" font-size="17" font-family="monospace">SITE PIPELINE</text>
  <g fill="#102c32" stroke="#6ed7b6" stroke-width="2">
    <rect x="48" y="315" width="240" height="170" rx="8" />
    <rect x="338" y="315" width="240" height="170" rx="8" />
    <rect x="628" y="315" width="270" height="170" rx="8" />
    <rect x="948" y="315" width="204" height="170" rx="8" />
  </g>
  <g fill="#d1fae5" font-size="18" font-family="monospace">
    <text x="64" y="352">Content files</text>
    <text x="64" y="384">.md / .mdx</text>
    <text x="64" y="412">prompts</text>
    <text x="64" y="440">agents</text>
    <text x="64" y="468">skills</text>

    <text x="354" y="352">Zod schemas</text>
    <text x="354" y="384">Content</text>
    <text x="354" y="412">collections</text>
    <text x="354" y="440">(config.ts)</text>

    <text x="644" y="352">Astro static build</text>
    <text x="644" y="384">index + [slug] pages</text>
    <text x="644" y="412">TS scripts: filter,</text>
    <text x="644" y="440">copy, template fill</text>
    <text x="644" y="468">React: nav, FAQ</text>

    <text x="964" y="352">GitHub Pages</text>
    <text x="964" y="384">static HTML</text>
    <text x="964" y="412">ai-hub.</text>
    <text x="964" y="440">alecreimel.com</text>
  </g>
  <path
    d="M288 400H322l-12-8m12 8-12 8M578 400H612l-12-8m12 8-12 8M898 400H932l-12-8m12 8-12 8"
    stroke="#6ed7b6"
    stroke-width="3"
    fill="none"
  />
  <path d="M768 225V315m0 0-8-12m8 12 8-12" stroke="#6ed7b6" stroke-width="2" stroke-dasharray="6 6" fill="none" />

  <text x="48" y="560" fill="#9ae6cf" font-size="20" font-family="monospace">
    Adding a file adds a page, a card and filters.
  </text>
  <text x="48" y="600" fill="#9ae6cf" font-size="16" font-family="monospace">
    Alec Reimel · Public repository architecture
  </text>
</svg>
