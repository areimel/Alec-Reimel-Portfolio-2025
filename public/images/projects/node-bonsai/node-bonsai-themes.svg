<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">node-bonsai themes</title>
  <desc id="desc">Four small bonsai trees, one per theme: green, cherry, maple and wisteria, each with leaf colours to match its theme name.</desc>
  <rect width="1200" height="630" fill="#07151b" />
  <rect x="40" y="40" width="1120" height="550" rx="12" fill="#07151b" stroke="#1d4a52" stroke-width="2" />
  <text x="80" y="104" fill="#9ae6cf" font-size="26" font-family="DejaVu Sans Mono, Menlo, Consolas, 'Liberation Mono', monospace">bonsai --theme &lt;name&gt;</text>
  <text x="80" y="136" fill="#5a8f86" font-size="16" font-family="DejaVu Sans Mono, Menlo, Consolas, 'Liberation Mono', monospace">Four built-in colour themes, each mapped to ANSI-256 leaf and wood colours.</text>
