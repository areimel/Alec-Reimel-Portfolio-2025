[build]
  publish = "dist"
  command = "npm run build"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep every incoming path on the canonical HTTPS www origin.
[[redirects]]
  from = "https://alecreimel.com/*"
  to = "https://www.alecreimel.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://alecreimel.com/*"
  to = "https://www.alecreimel.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://www.alecreimel.com/*"
  to = "https://www.alecreimel.com/:splat"
  status = 301
  force = true

# Retired project pages (removed 2026-11 when Projects were synced with bio.alecreimel.com).
[[redirects]]
  from = "/projects/bio-link"
  to = "/projects"
  status = 301
[[redirects]]
  from = "/projects/company-ai-prompts"
  to = "/projects/ai-hub"
  status = 301
