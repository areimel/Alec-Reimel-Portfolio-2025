site:
  name: Alec Reimel — Software Developer
  site: 'https://www.alecreimel.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: Alec Reimel — Software Developer
    template: '%s | Alec Reimel'
  description: 'Alec Reimel builds web applications, developer tools, and analytics integrations. Explore his projects and experience, and connect about US remote software roles.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Alec Reimel — Software Developer
    images:
      - url: '/preview.png'
        width: 1200
        height: 628
        alt: 'Alec Reimel — Software Developer'
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: false
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  projects:
    isEnabled: true
    projectsPerPage: 12

    project:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'projects' # Projects main path
      robots:
        index: true

    category:
      isEnabled: false
      pathname: 'category' # Category main path /projects/category/some-category
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag' # Tag main path /projects/tag/some-tag
      robots:
        index: false

    isRelatedProjectsEnabled: false

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
